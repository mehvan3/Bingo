<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#09090f,#15152a);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.app{
  width:100%;
  max-width:480px;
  text-align:center;
}

.logo{
  font-size:48px;
  font-weight:900;
  margin-bottom:8px;
  letter-spacing:2px;
}

.subtitle{
  color:#999;
  margin-bottom:30px;
}

.card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:24px;
  padding:24px;
  backdrop-filter:blur(20px);
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

input{
  width:100%;
  padding:16px;
  margin-bottom:14px;
  border-radius:14px;
  border:1px solid #333;
  background:#101018;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#7c5cff;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

.create{
  background:linear-gradient(135deg,#7c5cff,#a855f7);
  color:white;
}

.join{
  background:#252535;
  color:white;
}

button:active{
  transform:scale(.98);
}

.divider{
  margin:22px 0;
  color:#666;
  font-size:13px;
}

.footer{
  margin-top:25px;
  color:#555;
  font-size:12px;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">BINGO</div>
  <div class="subtitle">Play Bingo online with friends</div>

  <div class="card">

    <input
      id="playerName"
      type="text"
      placeholder="Enter your name"
      maxlength="20"
    >

    <button class="create" onclick="createRoom()">
      🎮 Create Room
    </button>

    <div class="divider">OR</div>

    <input
      id="roomCode"
      type="text"
      placeholder="Enter room code"
      maxlength="6"
    >

    <button class="join" onclick="joinRoom()">
      🔑 Join Room
    </button>

  </div>

  <div class="footer">
    © 2026 Bingo
  </div>

</div>

<script>
function createRoom(){
  const name=document.getElementById("playerName").value.trim();

  if(!name){
    alert("Please enter your name");
    return;
  }

  const code=Math.floor(100000+Math.random()*900000);

  alert("Room created!\\nRoom Code: "+code);
}

function joinRoom(){
  const name=document.getElementById("playerName").value.trim();
  const code=document.getElementById("roomCode").value.trim();

  if(!name){
    alert("Please enter your name");
    return;
  }

  if(code.length!==6){
    alert("Please enter a 6-digit room code");
    return;
  }

  alert("Joining room "+code+"...");
}
</script>

</body>
</html>
